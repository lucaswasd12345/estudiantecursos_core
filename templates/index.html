<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Inicio</a>
        <a href="/estudiantes/nuevo">Nuevo Estudiante</a>
    </nav>

    <h1>Cursos</h1>

    <form action="/cursos/crear" method="POST">
        <label>Nombre del curso:</label>
        <input type="text" name="nombre" required>
        <button type="submit">Crear curso</button>
    </form>

    {% if cursos %}
    <ul>
        {% for curso in cursos %}
        <li><a href="/cursos/{{ curso.id }}">{{ curso.nombre }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No hay cursos registrados.</p>
    {% endif %}
</body>
</html>
